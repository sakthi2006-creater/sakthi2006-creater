  </text>

  <text
    x="58"
    y="238"
    fill="#94A3B8"
    font-size="11"
    font-family="monospace">

    AI / ML

  </text>

  <text
    x="58"
    y="258"
    fill="#94A3B8"
    font-size="11"
    font-family="monospace">

    Graph Intelligence

  </text>

  <text
    x="58"
    y="278"
    fill="#94A3B8"
    font-size="11"
    font-family="monospace">

    Cyber AI

  </text>

  <text
    x="58"
    y="298"
    fill="#94A3B8"
