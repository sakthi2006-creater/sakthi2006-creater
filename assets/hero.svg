<svg
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- MAIN BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#071126"/>
      <stop offset="1" stop-color="#140B2E"/>
    </linearGradient>

    <!-- NEON GRADIENT -->
    <linearGradient id="neon" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="0.72" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C084FC">

        <animate
          attributeName="stop-color"
          values="#C084FC;#00E5FF;#7C3AED;#C084FC"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- CYAN -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- PURPLE -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <!-- GRID -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        stroke="#1E293B"
        stroke-width="1"
        opacity="0.55"/>

    </pattern>

    <!-- SMALL GRID -->
    <pattern
      id="microGrid"
      width="10"
      height="10"
      patternUnits="userSpaceOnUse">

      <path
        d="M10 0H0V10"
        stroke="#0F172A"
        stroke-width="0.8"
        opacity="0.5"/>

    </pattern>

    <!-- GLOW -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- SCAN MASK -->
    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <mask id="scanMask">
      <rect width="1200" height="520" fill="url(#scanGradient)"/>
    </mask>

  </defs>

  <!-- =============================== -->
  <!-- BACKGROUND -->
  <!-- =============================== -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="520"
    rx="30"
    fill="url(#bg)"/>

  <rect
    x="0"
    y="0"
    width="1200"
    height="520"
    rx="30"
    fill="url(#grid)"
    opacity="0.85"/>

  <rect
    x="0"
    y="0"
    width="1200"
    height="520"
    rx="30"
    fill="url(#microGrid)"
    opacity="0.22"/>

  <!-- =============================== -->
  <!-- AMBIENT LIGHT -->
  <!-- =============================== -->

  <circle
    cx="150"
    cy="130"
    r="120"
    fill="#06B6D4"
    opacity="0.10"
    filter="url(#softGlow)">

    <animate
      attributeName="r"
      values="100;135;100"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.06;0.13;0.06"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>

  <circle
    cx="1020"
    cy="390"
    r="130"
    fill="#7C3AED"
    opacity="0.10"
    filter="url(#softGlow)">

    <animate
      attributeName="r"
      values="110;145;110"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>

  <!-- =============================== -->
  <!-- OUTER FRAME -->
  <!-- =============================== -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="516"
    rx="30"
    stroke="url(#neon)"
    stroke-width="3"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="0.72;1;0.72"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>

  <rect
    x="14"
    y="14"
    width="1172"
    height="492"
    rx="24"
    stroke="#1E293B"
    stroke-width="1"/>

  <!-- =============================== -->
  <!-- TOP SYSTEM BAR -->
  <!-- =============================== -->

  <text
    x="40"
    y="48"
    fill="#22D3EE"
