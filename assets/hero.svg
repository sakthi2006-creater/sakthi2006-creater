  <!-- glowing separator -->
  <line
    x1="380"
    y1="257"
    x2="820"
    y2="257"
    stroke="url(#neon)"
    stroke-width="2"
    opacity="0.85"/>

  <!-- =============================== -->
  <!-- AI CORE -->
  <!-- =============================== -->

  <g transform="translate(600 385)">

    <!-- Outer rotating ring -->
    <g>

      <ellipse
        rx="110"
        ry="34"
        stroke="#22D3EE"
        stroke-width="1"
        opacity="0.45"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="8s"
        repeatCount="indefinite"/>

    </g>

    <!-- second ring -->
    <g transform="rotate(60)">

      <ellipse
        rx="110"
        ry="34"
        stroke="#8B5CF6"
        stroke-width="1"
        opacity="0.35"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="60"
        to="420"
        dur="11s"
        repeatCount="indefinite"/>

    </g>

    <!-- third ring -->
    <g transform="rotate(-55)">

      <ellipse
        rx="78"
        ry="25"
        stroke="#38BDF8"
        stroke-width="1"
        opacity="0.3"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="-55"
        to="305"
        dur="6s"
        repeatCount="indefinite"/>

    </g>

    <!-- CORE -->
    <circle
      r="18"
      fill="#06111F"
      stroke="#22D3EE"
      stroke-width="3"
      filter="url(#glow)">

      <animate
        attributeName="r"
        values="15;22;15"
        dur="2.4s"
        repeatCount="indefinite"/>

    </circle>

    <circle
      r="7"
      fill="#22D3EE"
      filter="url(#glow)">

      <animate
        attributeName="opacity"
        values="0.55;1;0.55"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>

    <!-- ORBIT NODE 1 -->
    <circle
      cx="110"
      cy="0"
      r="5"
      fill="#22D3EE"
      filter="url(#glow)">

      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        path="M0,0 C80,-40 140,40 110,0 C90,-25 60,30 0,0"/>

    </circle>

    <!-- ORBIT NODE 2 -->
    <circle
      cx="-85"
      cy="0"
      r="4"
      fill="#A78BFA"
      filter="url(#glow)">

      <animateMotion
        dur="7s"
        repeatCount="indefinite"
        path="M0,0 C-70,40 -120,-40 -85,0 C-65,25 -30,-25 0,0"/>

    </circle>

  </g>

  <!-- =============================== -->
  <!-- RIGHT TELEMETRY PANEL -->
  <!-- =============================== -->

  <rect
    x="918"
    y="88"
    width="244"
    height="270"
    rx="16"
    fill="#020617"
    stroke="#1E293B"
    stroke-width="1.5"/>

  <text
    x="940"
    y="116"
    fill="#22D3EE"
    font-family="monospace"
    font-size="11"
