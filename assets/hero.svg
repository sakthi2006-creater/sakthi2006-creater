    ● SYSTEM ONLINE

    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="1.8s"
      repeatCount="indefinite"/>

  </text>

  <text
    x="1120"
    y="48"
    text-anchor="end"
    fill="#64748B"
    font-size="11"
    font-family="monospace"
    letter-spacing="2">

    NODE://SKTH-AI-01

  </text>

  <!-- =============================== -->
  <!-- LEFT TERMINAL -->
  <!-- =============================== -->

  <rect
    x="38"
    y="88"
    width="245"
    height="270"
    rx="16"
    fill="#020617"
    stroke="#1E293B"
    stroke-width="1.5"/>

  <rect
    x="38"
    y="88"
    width="245"
    height="36"
    rx="16"
