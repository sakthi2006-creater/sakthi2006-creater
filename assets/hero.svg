    AI SYSTEM

  </text>

  <rect
    x="940"
    y="164"
    width="190"
    height="8"
    rx="4"
    fill="#0F172A"/>

  <rect
    x="940"
    y="164"
    width="146"
    height="8"
    rx="4"
    fill="url(#cyan)">

    <animate
      attributeName="width"
      values="120;165;145;180;146"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

  <text
    x="940"
    y="198"
    fill="#64748B"
    font-family="monospace"
    font-size="10">

    GRAPH INTELLIGENCE

  </text>

  <rect
    x="940"
    y="211"
    width="190"
    height="8"
    rx="4"
    fill="#0F172A"/>

  <rect
    x="940"
    y="211"
    width="112"
    height="8"
    rx="4"
    fill="url(#purple)">

    <animate
      attributeName="width"
      values="90;130;115;145;112"
      dur="3.7s"
      repeatCount="indefinite"/>

  </rect>

  <text
    x="940"
    y="245"
    fill="#64748B"
    font-family="monospace"
    font-size="10">

    SOFTWARE ENGINEERING

  </text>

  <rect
    x="940"
    y="258"
    width="190"
    height="8"
    rx="4"
    fill="#0F172A"/>

  <rect
    x="940"
